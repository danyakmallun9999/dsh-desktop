<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #1c1c1c;
      --text: #f8fafc;
      --dim: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Seluruh bar = area drag (double-click toggle maximize,
       right-click buka system menu berisi Move/Size/dll). */
    #bar {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
      /* Ruang aman tombol caption native di kanan (Win/Linux). */
      padding-right: 140px;
      app-region: drag;
      -webkit-app-region: drag;
    }
    #bar img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }
    #bar .name {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      white-space: nowrap;
    }
    #bar .ver {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="bar">
    <img src="deepseek.png" alt="">
    <span class="name">DeepSeek Harness</span>
    <span class="ver" id="tb-version"></span>
  </div>
  <script>
    const verEl = document.getElementById('tb-version');
    const barEl = document.getElementById('bar');
    // Traffic light macOS melayang di kiri-atas: beri ruang agar tak menutup logo.
    if (navigator.userAgent.includes('Mac')) {
      barEl.style.paddingLeft = '76px';
    }
    if (window.electronAPI && window.electronAPI.onStatusUpdate) {
      window.electronAPI.onStatusUpdate((data) => {
        if (data.version && verEl) {
          verEl.textContent = 'v' + data.version;
        }
      });
    }
  </script>
</body>
</html>
