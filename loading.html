<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --bg: #1c1c1c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --bar-color: #e2e8f0;
      --badge-update-bg: rgba(255, 255, 255, 0.08);
      --badge-update-border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pure Minimalist Floating Layout (No Card Wrappers) */
    .splash-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 320px;
      animation: fadeIn 0.4s ease-out forwards;
    }

    /* Direct Logo (No box/container) */
    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    /* Brand Typography (Dark Monochrome) */
    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.2;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .brand-title .brand-sub {
      color: #94a3b8;
      font-weight: 500;
    }

    .brand-edition {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 36px;
    }

    /* Floating Status & Progress */
    .status-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Typing-dot loader (pengganti progress bar garis) */
    .loader-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 18px;
    }

    .loader-dots span {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background-color: var(--bar-color);
      animation: dot-bounce 1.2s ease-in-out infinite;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    /* Versi dinamis: titik-titik kecil selama versi asli belum tiba.
       Tidak ada lagi teks versi statis di splash. */
    .version-pending {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .version-pending i {
      width: 4px;
      height: 4px;
      border-radius: 99px;
      background-color: var(--text-dim);
      animation: dot-bounce 1.2s ease-in-out infinite;
    }

    .version-pending i:nth-child(2) {
      animation-delay: 0.15s;
    }

    .version-pending i:nth-child(3) {
      animation-delay: 0.3s;
    }

    /* Clean Status Label */
    .status-text {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 95%;
    }

    /* Update Badge / Alert Pill (Shown when an update is detected) */
    .update-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: #f1f5f9;
      background-color: var(--badge-update-bg);
      border: 1px solid var(--badge-update-border);
      padding: 3px 10px;
      border-radius: 99px;
      animation: fadeIn 0.3s ease-out forwards;
    }

    /* Subtext Log Ticker */
    .log-ticker {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 10.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.2;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dot-bounce {
      0%, 60%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.35;
      }
      30% {
        transform: translateY(-5px) scale(1.15);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <main class="splash-view">
    <!-- Clean Floating Logo -->
    <img src="deepseek.png" alt="DeepSeek Logo" class="logo-img">

    <!-- Brand Typography -->
    <h1 class="brand-title">
      DeepSeek <span class="brand-sub">Harness</span>
    </h1>
    <span class="brand-edition"><span id="brand-version" class="version-pending" aria-label="memuat versi"><i></i><i></i><i></i></span> • Community Desktop</span>

    <!-- Status & Progress Section -->
    <div class="status-section">
      <div class="loader-dots" aria-label="memuat">
        <span></span><span></span><span></span>
      </div>

      <!-- Optional Update Notification Pill -->
      <div id="update-badge" class="update-badge" style="display: none;">
        <span id="update-badge-text">Mengunduh pembaruan versi terbaru...</span>
      </div>

      <span class="status-text" id="status-title">Memeriksa pembaruan & memuat server...</span>
      <div class="log-ticker" id="log-ticker">Menyiapkan lingkungan npx @deepseek-ai/dsh@latest...</div>
    </div>
  </main>

  <script>
    const statusTitle = document.getElementById('status-title');
    const logTicker = document.getElementById('log-ticker');
    const updateBadge = document.getElementById('update-badge');
    const updateBadgeText = document.getElementById('update-badge-text');
    const brandVersion = document.getElementById('brand-version');

    if (window.electronAPI && window.electronAPI.onStatusUpdate) {
      window.electronAPI.onStatusUpdate((data) => {
        if (data.title) {
          statusTitle.textContent = data.title;
        }
        if (data.detail) {
          logTicker.textContent = data.detail;
        }
        // Versi 100% dinamis dari main process (npm registry / backend).
        // Sebelum tiba, tampil sebagai titik-titik pending (lihat .version-pending).
        if (data.version && brandVersion) {
          brandVersion.classList.remove('version-pending');
          brandVersion.textContent = `v${data.version}`;
        }
        if (data.isUpdate && updateBadge) {
          updateBadge.style.display = 'inline-flex';
          if (data.version && updateBadgeText) {
            updateBadgeText.textContent = `Mengunduh pembaruan v${data.version}...`;
          }
        }
      });
    }
  </script>
</body>
</html>
