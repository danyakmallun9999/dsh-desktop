<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --panel-dark: #181e2b;
      --panel-light: #f5f4ef;
      --divider-color: rgba(255, 255, 255, 0.08);
      --icon-bg: #222a3a;
      --text-white: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --brand-soft-blue: #60a5fa;
      --brand-soft-cyan: #7dd3fc;
      --badge-bg: rgba(96, 165, 250, 0.12);
      --badge-border: rgba(96, 165, 250, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: var(--panel-dark);
    }

    /* Full Viewport Split Screen Layout */
    .splash-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: row;
      background-color: var(--panel-dark);
    }

    /* Left Panel: Soft Matte Dark Section */
    .brand-panel {
      flex: 0 0 40%;
      min-width: 360px;
      max-width: 520px;
      background-color: var(--panel-dark);
      border-right: 1px solid var(--divider-color);
      padding: clamp(36px, 6vh, 64px) clamp(32px, 4vw, 56px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .brand-logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background-color: var(--icon-bg);
      border: 1px solid var(--divider-color);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-title {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .brand-title .brand-accent {
      color: var(--brand-soft-cyan);
      display: block;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-title .brand-sub {
      color: var(--text-white);
      font-weight: 600;
    }

    .brand-edition {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--brand-soft-blue);
      background-color: var(--badge-bg);
      border: 1px solid var(--badge-border);
      padding: 3px 10px;
      border-radius: 5px;
      margin-top: 4px;
    }

    /* Middle Credits & Copyright */
    .credits-section {
      margin: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .artist-credit {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-white);
      letter-spacing: -0.01em;
    }

    .copyright-text {
      font-size: 11px;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 95%;
    }

    .legal-link {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* Bottom Status & Live Progress */
    .status-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--brand-soft-cyan);
      animation: pulse-simple 1.8s infinite ease-in-out;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Solid Clean Flat Linear Progress Bar (No Gradient) */
    .progress-track {
      width: 100%;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 32%;
      background-color: var(--brand-soft-blue);
      border-radius: 99px;
      animation: progress-slide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Live Output Ticker */
    .log-ticker {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    /* Right Panel: Light Canvas (Soft Cream) */
    .art-panel {
      flex: 1;
      background-color: var(--panel-light);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: clamp(20px, 4vw, 48px);
    }

    .art-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .art-panel:hover .art-image {
      transform: scale(1.02);
    }

    /* Responsive adjustments for smaller windows */
    @media (max-width: 768px) {
      .splash-container {
        flex-direction: column;
      }
      .brand-panel {
        flex: 0 0 auto;
        min-width: 100%;
        max-width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--divider-color);
        padding: 24px;
      }
      .art-panel {
        flex: 1;
        padding: 16px;
      }
    }

    /* Animations without harsh glows */
    @keyframes pulse-simple {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(0.85);
      }
    }

    @keyframes progress-slide {
      0% {
        left: -35%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <!-- Left Column: Soft Dark Studio -->
    <section class="brand-panel">
      <!-- Top Brand Section -->
      <div class="brand-header">
        <div class="brand-logo-row">
          <div class="brand-icon">
            <img src="deepseek.png" alt="DeepSeek Logo">
          </div>
          <div class="brand-title">
            <span class="brand-accent">DeepSeek</span>
            <span class="brand-sub">Harness</span>
          </div>
        </div>
        <span class="brand-edition">Community Desktop</span>
      </div>

      <!-- Middle Credits & Legal Notice -->
      <div class="credits-section">
        <div class="artist-credit">Artwork by DeepSeek Creative AI</div>
        <p class="copyright-text">
          &copy; 2026 DeepSeek AI & Community. All rights reserved.
        </p>
        <p class="legal-link">
          For more details and harness features, visit DeepSeek.
        </p>
      </div>

      <!-- Bottom Status Area -->
      <div class="status-section">
        <div class="status-row">
          <div class="pulse-dot" id="pulse-dot"></div>
          <span class="status-text" id="status-title">Memeriksa pembaruan & memuat server...</span>
        </div>

        <div class="progress-track">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="log-ticker" id="log-ticker">Menyiapkan lingkungan npx @deepseek-ai/dsh...</div>
      </div>
    </section>

    <!-- Right Column: Light Artwork Canvas with DeepSeek Whale Art -->
    <main class="art-panel">
      <img src="splash_artwork.jpg" alt="DeepSeek Blue Whale Splash Artwork" class="art-image">
    </main>
  </div>

  <script>
    const statusTitle = document.getElementById('status-title');
    const logTicker = document.getElementById('log-ticker');
    const pulseDot = document.getElementById('pulse-dot');

    if (window.electronAPI && window.electronAPI.onStatusUpdate) {
      window.electronAPI.onStatusUpdate((data) => {
        if (data.title) {
          statusTitle.textContent = data.title;
        }
        if (data.detail) {
          logTicker.textContent = data.detail;
        }
        if (data.ready) {
          pulseDot.style.backgroundColor = '#34d399';
        }
      });
    }
  </script>
</body>
</html>
