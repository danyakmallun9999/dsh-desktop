<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --bg: #0f141f;
      --card-bg: #161d2d;
      --border: rgba(255, 255, 255, 0.07);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --brand-blue: #60a5fa;
      --brand-cyan: #7dd3fc;
      --badge-bg: rgba(96, 165, 250, 0.1);
      --badge-border: rgba(96, 165, 250, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 380px;
      max-width: 90vw;
      padding: 40px 24px;
      animation: fadeIn 0.4s ease-out forwards;
    }

    /* Logo & Brand Header */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .brand-title .brand-accent {
      color: var(--brand-cyan);
    }

    .brand-title .brand-sub {
      color: var(--text-main);
      font-weight: 600;
    }

    .brand-badge {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand-blue);
      background-color: var(--badge-bg);
      border: 1px solid var(--badge-border);
      padding: 2.5px 9px;
      border-radius: 4px;
    }

    /* Status & Progress */
    .status-container {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--brand-cyan);
      animation: pulse-simple 1.8s infinite ease-in-out;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Minimal Solid Progress Bar */
    .progress-track {
      width: 100%;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 32%;
      background-color: var(--brand-blue);
      border-radius: 99px;
      animation: progress-slide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Terminal Subtext Ticker */
    .log-ticker {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 10.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    /* Minimal Footer */
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.01em;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse-simple {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.3;
        transform: scale(0.85);
      }
    }

    @keyframes progress-slide {
      0% {
        left: -35%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>

  <main class="splash-container">
    <!-- Brand Section (Logo & Title) -->
    <header class="brand-section">
      <div class="brand-icon">
        <img src="deepseek.png" alt="DeepSeek Logo">
      </div>
      <h1 class="brand-title">
        <span class="brand-accent">DeepSeek</span>
        <span class="brand-sub">Harness</span>
      </h1>
      <span class="brand-badge">Community Desktop</span>
    </header>

    <!-- Status & Progress Card -->
    <section class="status-container">
      <div class="status-row">
        <div class="pulse-dot" id="pulse-dot"></div>
        <span class="status-text" id="status-title">Memeriksa pembaruan & memuat server...</span>
      </div>

      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="log-ticker" id="log-ticker">Menyiapkan lingkungan npx @deepseek-ai/dsh...</div>
    </section>

    <!-- Minimal Footer -->
    <footer class="footer">
      <span>DeepSeek Harness Desktop &bull; v1.0.0</span>
    </footer>
  </main>

  <script>
    const statusTitle = document.getElementById('status-title');
    const logTicker = document.getElementById('log-ticker');
    const pulseDot = document.getElementById('pulse-dot');

    if (window.electronAPI && window.electronAPI.onStatusUpdate) {
      window.electronAPI.onStatusUpdate((data) => {
        if (data.title) {
          statusTitle.textContent = data.title;
        }
        if (data.detail) {
          logTicker.textContent = data.detail;
        }
        if (data.ready) {
          pulseDot.style.backgroundColor = '#34d399';
        }
      });
    }
  </script>
</body>
</html>
