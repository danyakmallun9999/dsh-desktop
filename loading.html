<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #0d1527 0%, #060913 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      padding: 32px;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(59, 130, 246, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .logo-inner {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    }
    .logo-inner svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    p.status {
      font-size: 13.5px;
      color: #94a3b8;
      margin-bottom: 18px;
      transition: color 0.2s ease;
    }
    .subtext {
      font-size: 11.5px;
      color: #64748b;
      line-height: 1.5;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="spinner"></div>
      <div class="logo-inner">
        <img src="deepseek.png" alt="DeepSeek Logo" style="width: 36px; height: 36px; object-fit: contain; border-radius: 8px;">
      </div>
    </div>
    <h1>DeepSeek Harness</h1>
    <p class="status" id="status-text">Memeriksa pembaruan & memulai server...</p>
    <p class="subtext">Menjalankan <code>npx @deepseek-ai/dsh@latest web</code> secara otomatis.</p>
  </div>
</body>
</html>
