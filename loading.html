<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(14, 18, 28, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #475569;
      --accent: #2563eb;
      --accent-light: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(37, 99, 235, 0.12), transparent 70%),
        radial-gradient(circle at 50% 100%, rgba(15, 23, 42, 0.6), transparent);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 440px;
      max-width: 90vw;
      box-shadow: 
        0 24px 48px -12px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .icon-wrapper {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .icon-wrapper img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 8px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #60a5fa;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.2);
      padding: 2px 8px;
      border-radius: 6px;
      margin-top: 4px;
    }

    /* Live Update & Status Box */
    .status-box {
      width: 100%;
      background: rgba(7, 10, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      margin-bottom: 20px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 12px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-light);
      box-shadow: 0 0 10px var(--accent-light);
      animation: pulse-glow 2s infinite ease-in-out;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 13.5px;
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, transparent);
      border-radius: 99px;
      animation: progress-slide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Subtext log ticker */
    .log-ticker {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      color: #64748b;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }

    .footer {
      font-size: 11.5px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }

    .footer-tag {
      color: #475569;
    }

    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    @keyframes progress-slide {
      0% {
        left: -40%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="header-section">
      <div class="icon-wrapper">
        <img src="deepseek.png" alt="Logo">
      </div>
      <h1 class="brand-title">DeepSeek Harness</h1>
      <span class="brand-badge">Community Desktop</span>
    </div>

    <!-- Live Status & Auto-Update Waiting Room -->
    <div class="status-box">
      <div class="status-row">
        <div class="pulse-dot" id="pulse-dot"></div>
        <span class="status-text" id="status-title">Memeriksa pembaruan & server...</span>
      </div>

      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="log-ticker" id="log-ticker">Menyiapkan lingkungan npx...</div>
    </div>

    <div class="footer">
      <span>Ruang Tunggu Pembaruan</span>
      <span class="footer-tag">v1.0.0</span>
    </div>
  </div>

  <script>
    const statusTitle = document.getElementById('status-title');
    const logTicker = document.getElementById('log-ticker');
    const pulseDot = document.getElementById('pulse-dot');

    if (window.electronAPI && window.electronAPI.onStatusUpdate) {
      window.electronAPI.onStatusUpdate((data) => {
        if (data.title) {
          statusTitle.textContent = data.title;
        }
        if (data.detail) {
          logTicker.textContent = data.detail;
        }
        if (data.ready) {
          pulseDot.style.backgroundColor = '#10b981';
          pulseDot.style.boxShadow = '0 0 10px #10b981';
        }
      });
    }
  </script>
</body>
</html>
